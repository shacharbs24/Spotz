name: Appointment reminders

on:
  schedule:
    # GitHub schedules use UTC. The reminder runner itself decides which
    # appointments are due, so daylight-saving changes do not affect it.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report due reminders without sending or writing to the database
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: appointment-reminders
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APP_BASE_URL}" ]]; then
            echo "Missing repository variable APP_BASE_URL" >&2
            exit 1
          fi
          if [[ -z "${CRON_SECRET}" ]]; then
            echo "Missing repository secret CRON_SECRET" >&2
            exit 1
          fi

      - name: Dispatch due reminders
        shell: bash
        run: |
          set -euo pipefail
          url="${APP_BASE_URL%/}/api/cron/reminders"
          if [[ "${DRY_RUN}" == "true" ]]; then
            url="${url}?dryRun=1"
          fi

          curl \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 60 \
            "${url}"
